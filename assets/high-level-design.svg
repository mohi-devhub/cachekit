<text x="981" y="413" text-anchor="start" class="label">Explicit source-fix workflow · external fixer stays outside the engine</text>
<rect class="box" x="990" y="435" width="253" height="78" rx="10"/>
<text x="1116.5" y="460" text-anchor="middle" class="label">Constrained task builder</text>
<text x="1116.5" y="481" text-anchor="middle" class="small">Redacted structured findings</text>
<text x="1116.5" y="498" text-anchor="middle" class="small">Allowed files · preserved baseline</text>
<rect class="box" x="1340" y="435" width="275" height="78" rx="10"/>
<text x="1477.5" y="460" text-anchor="middle" class="label">Devin · explicit capped session</text>
<text x="1477.5" y="481" text-anchor="middle" class="small">Repository source + redacted task only</text>
<text x="1477.5" y="498" text-anchor="middle" class="small">Fresh branch; no private prompt logs</text>
<rect class="box" x="990" y="564" width="253" height="81" rx="10"/>
<text x="1116.5" y="589" text-anchor="middle" class="label">Local deterministic verifier</text>
<text x="1116.5" y="610" text-anchor="middle" class="small">Scope / content / roles / tests / reuse</text>
<text x="1116.5" y="627" text-anchor="middle" class="small">Consumes saved golden outputs and reviews</text>
