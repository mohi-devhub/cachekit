<text x="600.0" y="245" text-anchor="middle" class="label">Ingest and validate</text>
<text x="600.0" y="266" text-anchor="middle" class="small">Native JSONL / public-dataset adapters</text>
<rect class="box" x="406" y="291" width="388" height="59" rx="10"/>
<text x="600.0" y="316" text-anchor="middle" class="label">Render and tokenize</text>
<text x="600.0" y="337" text-anchor="middle" class="small">Exact local Qwen chat template and token IDs</text>
<rect class="box" x="406" y="362" width="388" height="59" rx="10"/>
<text x="600.0" y="387" text-anchor="middle" class="label">Diagnose cache breakers</text>
<text x="600.0" y="408" text-anchor="middle" class="small">Route grouping · stable/variable alignment · rules</text>
<rect class="box" x="406" y="433" width="388" height="59" rx="10"/>
<text x="600.0" y="458" text-anchor="middle" class="label">Simulate prefix reuse</text>
<text x="600.0" y="479" text-anchor="middle" class="small">Sequential prompt-only block cache · bounded capacity</text>
<rect class="box" x="406" y="504" width="388" height="59" rx="10"/>
<text x="600.0" y="529" text-anchor="middle" class="label">Build report</text>
<text x="600.0" y="550" text-anchor="middle" class="small">Findings · redacted preview · SIMULATED reuse</text>
