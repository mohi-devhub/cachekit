<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1000" viewBox="0 0 1680 1000">
<title>cachekit: high-level design</title>
<desc>Recorded requests enter a deterministic offline analysis pipeline. Local API and dashboard inspect saved evidence. Explicit bounded Devin handoff and model collectors operate outside the core. Human review remains separate.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#252525"/></marker></defs>
<rect width="1680" height="1000" fill="#fff"/>
<style>text{font-family:"Segoe Print","Bradley Hand",ui-sans-serif,system-ui,sans-serif;fill:#161616}.title{font-size:24px;font-weight:600}.label{font-size:16px;font-weight:600}.small{font-size:12px;fill:#555}.edge{fill:none;stroke:#252525;stroke-width:1.35;marker-end:url(#arrow)}.group{fill:none;stroke:#555;stroke-width:1.25;stroke-dasharray:6 5}.box{fill:#fff;stroke:#333;stroke-width:1.35}</style>
<text x="840" y="34" text-anchor="middle" class="title">cachekit: High-Level Design</text>
<rect class="group" x="340" y="65" width="520" height="555" rx="14"/>
<text x="356" y="88" text-anchor="start" class="label">Offline engine · Python · no LLM or network calls</text>
<rect class="box" x="365" y="105" width="470" height="64" rx="10"/>
<text x="600.0" y="130" text-anchor="middle" class="label">Typed contracts and pinned configuration</text>
<text x="600.0" y="151" text-anchor="middle" class="small">Pydantic · model/tokenizer revision · cache profile</text>
<rect x="380" y="199" width="440" height="395" rx="13" fill="none" stroke="#222"/>
<rect x="386" y="205" width="428" height="383" rx="9" fill="none" stroke="#777"/>
